name: Prepare font binary merge

on:
  push:
    branches:
      - maintenance/export-fonts-from-lfs

permissions:
  contents: write

concurrency:
  group: prepare-font-binary-merge
  cancel-in-progress: false

jobs:
  prepare-merge-branch:
    if: contains(github.event.head_commit.message, '[prepare main merge]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: target
          fetch-depth: 1
          lfs: false
          persist-credentials: true

      - name: Checkout exported font branch
        uses: actions/checkout@v4
        with:
          ref: maintenance/export-fonts-from-lfs
          path: source
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Import only font binaries and LFS attributes
        shell: bash
        run: |
          set -euo pipefail
          cp -a source/public/fonts/. target/public/fonts/
          cp source/.gitattributes target/.gitattributes
          cd target
          git switch -c merge/export-font-binaries-to-main
          git add .gitattributes public/fonts

          python3 - <<'PY'
          import subprocess
          raw = subprocess.check_output(["git", "ls-files", "-s", "-z", "--", "public/fonts"])
          rows = []
          for item in raw.split(b"\\0"):
              if not item:
                  continue
              meta, path = item.split(b"\\t", 1)
              mode, sha, stage = meta.decode().split()
              name = path.decode("utf-8", "surrogateescape")
              if name.lower().endswith((".otf", ".ttf", ".woff", ".woff2", ".eot", ".ttc", ".otc", ".dfont", ".pfa", ".pfb")):
                  rows.append((name, sha))
          if len(rows) != 6087:
              raise SystemExit(f"Expected 6087 font files, got {len(rows)}")
          pointers = []
          total = 0
          for name, sha in rows:
              blob = subprocess.check_output(["git", "cat-file", "blob", sha])
              if blob.startswith(b"version https://git-lfs.github.com/spec/v1"):
                  pointers.append(name)
              total += len(blob)
          print(f"Verified font blobs: {len(rows)}")
          print(f"Remaining LFS pointers: {len(pointers)}")
          print(f"Total font payload: {total} bytes")
          if pointers:
              raise SystemExit(f"LFS pointers remain: {pointers[:10]}")
          PY

          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(fonts): import original font binaries into main history"
          git push origin HEAD:refs/heads/merge/export-font-binaries-to-main
