name: Build validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Check Astro and TypeScript diagnostics
        run: npm run check
      - name: Check browser script syntax
        run: |
          node --check public/scripts/i18n.js
          node --check public/scripts/deteksi-fitur.js
          node --check public/houdini/batik-paint-worklet.js
      - name: Build Astro site
        run: npm run build
      - name: Audit generated HTML quality and accessibility preflight
        run: npm run audit:html
