name: Build validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Check Astro and TypeScript diagnostics
        run: npm run check
      - name: Check browser script syntax
        run: |
          node --check public/scripts/i18n.js
          node --check public/scripts/deteksi-fitur.js
          node --check public/houdini/batik-paint-worklet.js
      - name: Audit font loading and static performance budgets
        run: npm run audit:performance
      - name: Audit localization catalog coverage
        run: npm run audit:localization
      - name: Build Astro site
        env:
          FONT_LFS_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build
      - name: Audit Tamil font assets and locale wiring
        run: npm run audit:tamil
      - name: Audit generated sitemap and canonical SEO metadata
        run: npm run audit:seo
      - name: Audit generated HTML quality and accessibility preflight
        run: npm run audit:html
      - name: Audit archived source HTML and provenance index
        run: npm run audit:archive
      - name: Audit source-to-page content provenance
        run: npm run audit:provenance
      - name: Verify complete WCAG 2.2 Level A and AA release matrix
        run: npm run audit:wcag-matrix
      - name: WCAG 2.2 A/AA static preflight
        run: npm run audit:a11y
      - name: Inclusive accessibility integration preflight
        run: npm run audit:inclusive-a11y
      - name: CVD adaptation source audit
        run: npm run audit:cvd
      - name: Dependency security audit
        run: npm run audit:security
