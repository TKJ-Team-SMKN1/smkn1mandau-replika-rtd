name: Export font binaries from Git LFS

on:
  push:
    branches:
      - maintenance/export-fonts-from-lfs

permissions:
  contents: write

concurrency:
  group: export-fonts-from-lfs
  cancel-in-progress: false

jobs:
  export-fonts:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository and hydrate LFS objects
        uses: actions/checkout@v4
        with:
          ref: maintenance/export-fonts-from-lfs
          fetch-depth: 0
          lfs: true
          persist-credentials: true

      - name: Export LFS history into Git blobs
        shell: bash
        run: |
          set -euo pipefail
          git lfs install
          git lfs fetch --all origin
          git lfs fsck

          # Rewrite the isolated maintenance branch so every matching historical
          # LFS object becomes an ordinary Git blob. This is the supported export
          # path; staging hydrated files with the clean filter still active is not.
          git lfs migrate export \
            --include='*.otf,*.ttf,*.woff,*.woff2,*.eot,*.ttc,*.otc,*.dfont,*.pfa,*.pfb' \
            --include-ref=refs/heads/maintenance/export-fonts-from-lfs \
            --yes

          # Verify the index/tree payload itself, not just the hydrated worktree.
          python3 - <<'PY'
          import subprocess
          raw = subprocess.check_output(["git", "ls-tree", "-r", "-l", "HEAD"])
          rows = []
          for line in raw.decode().splitlines():
              meta, path = line.split("\\t", 1)
              fields = meta.split()
              size = int(fields[3]) if fields[3] != "-" else 0
              lower = path.lower()
              if lower.endswith((".otf", ".ttf", ".woff", ".woff2", ".eot", ".ttc", ".otc", ".dfont", ".pfa", ".pfb")):
                  rows.append((path, size, fields[2]))
          if len(rows) != 6087:
              raise SystemExit(f"Expected 6087 font blobs in HEAD; found {len(rows)}")
          pointers = []
          too_large = []
          total = 0
          for path, size, sha in rows:
              blob = subprocess.check_output(["git", "cat-file", "blob", sha])
              if blob.startswith(b"version https://git-lfs.github.com/spec/v1"):
                  pointers.append(path)
              if size >= 100 * 1024 * 1024:
                  too_large.append((path, size))
              total += size
          print(f"Font blobs in HEAD: {len(rows)}")
          print(f"Pointer blobs remaining: {len(pointers)}")
          print(f"Total Git font payload: {total} bytes ({total / 1024**3:.3f} GiB)")
          if pointers:
              print("First remaining pointers:", *pointers[:20], sep="\\n")
              raise SystemExit("LFS pointer blobs remain in HEAD")
          if too_large:
              raise SystemExit(f"GitHub 100 MiB file limit exceeded: {too_large[:5]}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore(fonts): export all font binaries from Git LFS [skip ci]"
          git push --force-with-lease origin HEAD:maintenance/export-fonts-from-lfs
